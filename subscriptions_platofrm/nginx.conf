worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Load Balancing Upstream
    upstream django_backend {
        server localhost:8000;
        server localhost:8001;
        server localhost:8002;
        # Add more backend servers here
    }

    # CDN Cache Path (Adjust path based on your Nginx installation)
    proxy_cache_path temp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # Static file serving
        location /static/ {
            alias D:/A_NijalKumar_SS/Django_DRF/Subsription_project/subscriptions_platofrm/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Media file serving
        location /media/ {
            alias D:/A_NijalKumar_SS/Django_DRF/Subsription_project/subscriptions_platofrm/media/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # API Proxy with CDN-like Caching
        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable Nginx Caching (CDN Layer)
            proxy_cache my_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_revalidate on;
            proxy_cache_min_uses 1;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_background_update on;

            # Browser Cache Control
            add_header X-Proxy-Cache $upstream_cache_status;
            # Ensure Nginx passes through Cache-Control headers from Django
            proxy_pass_header Cache-Control;
        }
    }
}
